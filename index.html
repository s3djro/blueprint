<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Blueprint</title>

<!-- Installation écran d'accueil iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blueprint">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#062B16">

<style>
  :root{
    --bg:#062B16;
    --surface:#0C3D20;
    --line:#1F7A46;
    --grid-line:rgba(31,122,70,0.18);
    --paper:#E8F5EC;
    --muted:#7FB08F;
    --coral:#E4572E;
    --font-display:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:var(--font-body);
    overscroll-behavior-y:none;
  }

  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:28px 28px;
  }

  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .topbar{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }

  .wordmark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    margin:0;
  }

  .tagline{
    font-size:12px;
    color:var(--muted);
    margin:2px 0 0;
  }

  main{ flex:1; overflow-y:auto; padding-bottom:90px; }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- Feed ---------- */

  #feed-list{ padding:18px 16px 8px; display:flex; flex-direction:column; gap:26px; }

  .post{ position:relative; }

  .post-frame{
    position:relative;
    border:1px solid var(--line);
    background:var(--surface);
  }

  .carousel-wrap{ position:relative; }
  .carousel{
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .carousel::-webkit-scrollbar{ display:none; }
  .carousel-track{ display:flex; }
  .carousel-slide{ flex:0 0 100%; scroll-snap-align:start; }
  .carousel-slide img, .carousel-slide video{ display:block; width:100%; max-height:560px; object-fit:cover; background:#000; }

  .carousel-dots{
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; justify-content:center; gap:5px;
  }
  .carousel-dot{ width:16px; height:16px; display:flex; align-items:center; justify-content:center; background:none; border:none; padding:0; }
  .carousel-dot::after{ content:""; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.4); }
  .carousel-dot.active::after{ background:var(--paper); }

  .frame-expand{
    position:absolute; top:8px; right:8px; z-index:2;
    width:30px; height:30px;
    background:rgba(6,43,22,0.7); color:var(--paper); border:none;
    display:flex; align-items:center; justify-content:center;
  }
  .frame-expand svg{ width:16px; height:16px; }

  .crop{ position:absolute; width:16px; height:16px; z-index:1; }
  .crop::before, .crop::after{ content:""; position:absolute; background:var(--paper); }
  .crop-tl{ top:-1px; left:-1px; }
  .crop-tl::before{ width:16px; height:2px; top:0; left:0; }
  .crop-tl::after{ width:2px; height:16px; top:0; left:0; }
  .crop-br{ bottom:-1px; right:-1px; }
  .crop-br::before{ width:16px; height:2px; bottom:0; right:0; }
  .crop-br::after{ width:2px; height:16px; bottom:0; right:0; }

  .post-caption{ font-size:15px; line-height:1.4; margin:12px 0 8px; }

  .post-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top:1px solid var(--line);
    padding-top:8px;
  }

  .post-date{ font-size:13px; color:var(--muted); }

  .pin-btn{
    background:none; border:none; padding:4px; color:var(--muted);
    display:flex; align-items:center; gap:6px; font-size:13px; font-family:var(--font-body);
  }
  .pin-btn svg{ width:18px; height:18px; }
  .pin-btn.active{ color:var(--coral); }
  .pin-btn.active svg{ fill:var(--coral); }

  .post-text{
    padding:14px 16px 12px 18px;
    border-left:3px solid var(--line);
    background:var(--surface);
  }
  .text-post-body{ font-size:16px; line-height:1.5; margin:0 0 12px; white-space:pre-wrap; }
  .text-post-actions{ display:flex; align-items:center; gap:16px; }
  .post-text textarea{ margin-bottom:10px; }
  .post-text .edit-actions{ margin-bottom:0; }

  .empty-state{
    margin:60px 24px 0;
    text-align:center;
  }
  .empty-state h2{ font-family:var(--font-display); font-size:19px; margin:0 0 8px; }
  .empty-state p{ color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.5; }

  /* ---------- Profile / grid ---------- */

  .profile-header{
    padding:20px 16px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .profile-header h2{ font-family:var(--font-display); font-size:17px; margin:0; font-weight:600; }
  .profile-count{ color:var(--muted); font-size:13px; }

  .bio-block{ padding:0 16px 14px; }
  .bio-text{ font-size:14px; line-height:1.5; margin:0 0 8px; color:var(--paper); }
  .bio-text:empty::before{ content:"Aucune bio pour l'instant."; color:var(--muted); font-style:italic; }
  .bio-row{ display:flex; align-items:center; gap:12px; }
  .bio-edit-actions{ display:flex; gap:10px; }
  #bio-input{ margin-bottom:10px; height:60px; }

  .mode-toggle{ display:flex; border:1px solid var(--line); margin-bottom:16px; }
  .mode-btn{
    flex:1; padding:10px; background:none; border:none; color:var(--muted);
    font-family:var(--font-body); font-size:14px; font-weight:600;
  }
  .mode-btn.active{ background:var(--line); color:var(--paper); }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:2px;
    padding:0 2px;
  }
  .grid-cell{ position:relative; aspect-ratio:1/1; overflow:hidden; background:var(--surface); }
  .grid-cell video{ width:100%; height:100%; object-fit:cover; display:block; }
  .grid-video-placeholder{
    position:absolute; bottom:5px; left:5px; width:18px; height:18px;
    color:#fff; filter:drop-shadow(0 0 2px rgba(0,0,0,0.7));
  }
  .stack-badge{ position:absolute; top:5px; right:5px; width:16px; height:16px; color:#fff; filter:drop-shadow(0 0 2px rgba(0,0,0,0.7)); }
  .grid-cell img{ width:100%; height:100%; object-fit:cover; display:block; }

  .backup-row{
    display:flex; gap:18px; justify-content:center;
    padding:26px 16px 10px;
  }
  .link-btn{
    background:none; border:none; color:var(--muted);
    font-family:var(--font-body); font-size:13px;
    text-decoration:underline; text-underline-offset:3px;
    padding:6px;
  }

  /* ---------- Tab bar ---------- */

  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:520px;
    margin:0 auto;
    background:rgba(6,43,22,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:10px 24px calc(10px + env(safe-area-inset-bottom));
  }
  .tab{
    background:none; border:none; color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px;
  }
  .tab svg{ width:26px; height:26px; }
  .tab.active{ color:var(--paper); }
  .tab.add{
    width:50px; height:50px;
    border:1.5px solid var(--paper);
    color:var(--paper);
  }

  /* ---------- Bottom sheet (new post) ---------- */

  .sheet{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:flex-end;
    background:rgba(6,20,36,0.6);
  }
  .sheet[hidden]{ display:none; }
  .sheet-inner{
    width:100%;
    background:var(--bg);
    border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  .sheet-handle{
    width:36px; height:4px; background:var(--line);
    border-radius:2px; margin:6px auto 16px;
  }
  .sheet-inner h2{ font-family:var(--font-display); font-size:17px; margin:0 0 16px; }

  .media-strip{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
  .media-add-tile{
    flex:0 0 auto; width:84px; height:84px;
    border:1px dashed var(--line); color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:300;
  }
  .media-tile{ position:relative; flex:0 0 auto; width:84px; height:84px; border:1px solid var(--line); background:#000; }
  .media-tile img, .media-tile video{ width:100%; height:100%; object-fit:cover; display:block; }
  .video-badge{
    position:absolute; bottom:4px; left:4px; width:18px; height:18px;
    color:#fff; filter:drop-shadow(0 0 2px rgba(0,0,0,0.8));
  }
  .video-size{
    position:absolute; bottom:4px; right:4px; font-size:10px; color:#fff;
    background:rgba(0,0,0,0.65); padding:1px 4px;
  }
  .media-remove{
    position:absolute; top:2px; right:2px; width:20px; height:20px;
    background:rgba(0,0,0,0.65); color:#fff; border:none; font-size:14px; line-height:1;
  }

  textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:var(--font-body);
    font-size:15px;
    padding:10px 12px;
    resize:none;
    height:70px;
    margin-bottom:16px;
  }
  textarea::placeholder{ color:var(--muted); }
  textarea:focus{ outline:none; border-color:var(--paper); }

  .sheet-actions{ display:flex; gap:10px; }
  .btn{
    flex:1;
    padding:13px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    border:1px solid var(--line);
    background:none;
    color:var(--paper);
  }
  .btn.primary{ background:var(--line); }
  .btn:disabled{ opacity:0.4; }
  .btn.ghost{ color:var(--muted); }

  /* ---------- Detail lightbox ---------- */

  .sheet.full{ align-items:stretch; background:var(--bg); }
  .sheet.full .sheet-inner{ display:none; }
  #modal-detail{ flex-direction:column; overflow-y:auto; }
  #detail-media .carousel-slide img, #detail-media .carousel-slide video{ max-height:none; }
  .detail-body{ padding:16px 20px calc(20px + env(safe-area-inset-bottom)); }
  .close{
    position:absolute; top:calc(16px + env(safe-area-inset-top)); right:16px;
    z-index:5; background:rgba(6,43,22,0.7); border:none; color:var(--paper);
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  }
  #detail-caption{ font-size:15px; line-height:1.5; margin:0 0 14px; }
  .detail-row{
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid var(--line); padding-top:12px;
  }
  .detail-actions{ display:flex; align-items:center; gap:18px; }
  #btn-delete, #btn-edit-caption{ background:none; border:none; color:var(--muted); font-family:var(--font-body); font-size:13px; text-decoration:underline; text-underline-offset:3px; }
  .edit-actions{ display:flex; gap:10px; margin-bottom:14px; }
  .btn.small{ padding:9px; font-size:13px; }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div>
      <p class="wordmark">Blueprint</p>
      <p class="tagline">Building my picture on this playground</p>
    </div>
  </header>

  <main>
    <section id="view-feed" class="view active">
      <div id="feed-list"></div>
      <div id="feed-empty" class="empty-state" hidden>
        <h2>Ta pellicule est vierge</h2>
        <p>Ajoute ta première photo pour démarrer ton journal.</p>
        <button class="btn primary" id="btn-empty-add" style="max-width:220px;margin:0 auto;">Ajouter une photo</button>
      </div>
    </section>

    <section id="view-grid" class="view">
      <div class="profile-header">
        <h2>Blueprint</h2>
        <span class="profile-count" id="post-count">0 publication</span>
      </div>
      <div class="bio-block">
        <p class="bio-text" id="bio-text"></p>
        <textarea id="bio-input" hidden maxlength="160" placeholder="Écris ta bio..."></textarea>
        <div class="bio-row">
          <button class="link-btn" id="btn-edit-bio">Modifier la bio</button>
          <div class="bio-edit-actions" id="bio-edit-actions" hidden>
            <button class="btn ghost small" id="btn-bio-cancel">Annuler</button>
            <button class="btn primary small" id="btn-bio-save">Enregistrer</button>
          </div>
        </div>
      </div>
      <div class="grid" id="grid-list"></div>
      <div class="backup-row">
        <button class="link-btn" id="btn-export">Exporter une sauvegarde</button>
        <button class="link-btn" id="btn-import-trigger">Importer une sauvegarde</button>
        <input type="file" id="import-input" accept="application/json" hidden>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="feed" aria-label="Fil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
    </button>
    <button class="tab add" id="btn-add" aria-label="Ajouter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-view="grid" aria-label="Profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
    </button>
  </nav>
</div>

<!-- Nouveau post -->
<div class="sheet" id="modal-new" hidden>
  <div class="sheet-inner">
    <div class="sheet-handle"></div>
    <h2>Nouveau post</h2>
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-media" data-mode="media">Média</button>
      <button class="mode-btn" id="mode-text" data-mode="text">Texte</button>
    </div>
    <div class="media-strip" id="media-strip">
      <label class="media-add-tile" for="file-input">+</label>
    </div>
    <input type="file" id="file-input" accept="image/*,video/*" multiple hidden>
    <textarea id="caption-input" placeholder="Ajoute une légende..." maxlength="280"></textarea>
    <div class="sheet-actions">
      <button class="btn ghost" id="btn-cancel">Annuler</button>
      <button class="btn primary" id="btn-publish" disabled>Publier</button>
    </div>
  </div>
</div>

<!-- Détail / lightbox -->
<div class="sheet full" id="modal-detail" hidden>
  <button class="close" id="btn-close-detail" aria-label="Fermer">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <div id="detail-media"></div>
  <div class="detail-body">
    <p id="detail-caption"></p>
    <textarea id="detail-caption-input" maxlength="280" hidden placeholder="Ajoute une légende..."></textarea>
    <div class="edit-actions" id="edit-actions" hidden>
      <button class="btn ghost small" id="btn-edit-cancel">Annuler</button>
      <button class="btn primary small" id="btn-edit-save">Enregistrer</button>
    </div>
    <div class="detail-row" id="detail-row-main">
      <span class="post-date" id="detail-date"></span>
      <div class="detail-actions">
        <button id="btn-edit-caption">Modifier</button>
        <button class="pin-btn" id="btn-fav">
          <svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6H19l-4.6 3.4 1.8 5.6L12 13.2 7.8 16.6l1.8-5.6L5 8h5.2z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
          <span id="fav-label">Favori</span>
        </button>
        <button id="btn-delete">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DB_NAME = "blueprintDB", STORE = "posts", META_STORE = "meta", db = null;
  var objectUrls = [];

  function openDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, 2);
      req.onupgradeneeded = function(e){
        var d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)){
          var store = d.createObjectStore(STORE, {keyPath:"id", autoIncrement:true});
          store.createIndex("ts", "ts");
        }
        if(!d.objectStoreNames.contains(META_STORE)){
          d.createObjectStore(META_STORE, {keyPath:"id"});
        }
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject(e); };
    });
  }

  function tx(mode){ return db.transaction(STORE, mode).objectStore(STORE); }
  function metaTx(mode){ return db.transaction(META_STORE, mode).objectStore(META_STORE); }

  function addPost(type, media, caption, ts){
    return new Promise(function(resolve, reject){
      var record = { type: type, caption: caption || "", ts: ts || Date.now(), fav:false };
      if(type !== "text") record.media = media || [];
      var req;
      try {
        req = tx("readwrite").add(record);
      } catch(e){
        reject(e);
        return;
      }
      req.onsuccess = function(){ resolve(); };
      req.onerror = function(){ reject(req.error || new Error("Erreur inconnue")); };
    });
  }

  function getProfile(){
    return new Promise(function(resolve, reject){
      var req = metaTx("readonly").get("profile");
      req.onsuccess = function(e){ resolve(e.target.result || {id:"profile", bio:""}); };
      req.onerror = reject;
    });
  }

  function saveProfile(bio){
    return new Promise(function(resolve, reject){
      var req = metaTx("readwrite").put({id:"profile", bio: bio || ""});
      req.onsuccess = resolve; req.onerror = reject;
    });
  }

  function getAll(){
    return new Promise(function(resolve, reject){
      var req = tx("readonly").getAll();
      req.onsuccess = function(e){
        var list = e.target.result.sort(function(a,b){ return b.ts - a.ts; });
        resolve(list);
      };
      req.onerror = reject;
    });
  }

  function deletePost(id){
    return new Promise(function(resolve, reject){
      var req = tx("readwrite").delete(id);
      req.onsuccess = resolve; req.onerror = reject;
    });
  }

  function updatePost(post){
    return new Promise(function(resolve, reject){
      var req = tx("readwrite").put(post);
      req.onsuccess = resolve; req.onerror = reject;
    });
  }

  function getOne(id){
    return new Promise(function(resolve, reject){
      var req = tx("readonly").get(id);
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = reject;
    });
  }

  // Redimensionne/compresse l'image choisie avant stockage
  function compressImage(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        var max = 1280;
        var w = img.width, h = img.height;
        if(w > max || h > max){
          if(w > h){ h = Math.round(h * (max / w)); w = max; }
          else{ w = Math.round(w * (max / h)); h = max; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(blob){ resolve(blob); }, "image/jpeg", 0.85);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  function revokeAllUrls(){
    objectUrls.forEach(function(u){ URL.revokeObjectURL(u); });
    objectUrls = [];
  }

  function fmtDate(ts){
    return new Intl.DateTimeFormat("fr-FR", {day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"}).format(new Date(ts));
  }

  // Compatibilité : anciens posts avec un seul champ "image" -> tableau media normalisé.
  // Recompose aussi les fichiers qui avaient été découpés en morceaux au stockage.
  function getMediaArray(post){
    var raw;
    if(post.media && post.media.length) raw = post.media;
    else if(post.image) raw = [{ blob: post.image, kind: "image" }];
    else raw = [];

    return raw.map(function(m){
      if(m.chunks){
        var mime = m.mime || (m.kind === "video" ? "video/mp4" : "image/jpeg");
        return { kind: m.kind, blob: new Blob(m.chunks, { type: mime }) };
      }
      return m;
    });
  }

  // Construit un carrousel (1 ou plusieurs médias). bare=true : sans cadre ni coins (vue détail).
  function buildMediaFrame(mediaArray, bare){
    var carousel = document.createElement("div");
    carousel.className = "carousel";
    var track = document.createElement("div");
    track.className = "carousel-track";
    carousel.appendChild(track);

    mediaArray.forEach(function(m){
      var url = URL.createObjectURL(m.blob);
      objectUrls.push(url);
      var slide = document.createElement("div");
      slide.className = "carousel-slide";
      if(m.kind === "video"){
        var video = document.createElement("video");
        video.src = url; video.controls = true; video.playsInline = true; video.preload = "metadata";
        slide.appendChild(video);
      } else {
        var img = document.createElement("img");
        img.src = url; img.alt = "";
        slide.appendChild(img);
      }
      track.appendChild(slide);
    });

    var wrapper = document.createElement("div");
    if(bare){
      wrapper.className = "carousel-wrap";
      wrapper.appendChild(carousel);
    } else {
      wrapper.className = "post-frame";
      wrapper.appendChild(carousel);
      wrapper.insertAdjacentHTML("beforeend", '<span class="crop crop-tl"></span><span class="crop crop-br"></span>');
    }

    if(mediaArray.length > 1){
      var dots = document.createElement("div");
      dots.className = "carousel-dots";
      mediaArray.forEach(function(_, i){
        var dot = document.createElement("span");
        dot.className = "carousel-dot" + (i === 0 ? " active" : "");
        dot.addEventListener("click", function(ev){
          ev.stopPropagation();
          carousel.scrollTo({ left: i * carousel.clientWidth, behavior: "smooth" });
        });
        dots.appendChild(dot);
      });
      wrapper.appendChild(dots);
      carousel.addEventListener("scroll", function(){
        var idx = Math.round(carousel.scrollLeft / carousel.clientWidth);
        Array.prototype.forEach.call(dots.children, function(d, i){ d.classList.toggle("active", i === idx); });
      });
    }

    return wrapper;
  }

  // ---------- Rendu ----------

  var feedList = document.getElementById("feed-list");
  var feedEmpty = document.getElementById("feed-empty");
  var gridList = document.getElementById("grid-list");
  var postCount = document.getElementById("post-count");

  function renderAll(){
    getAll().then(function(posts){
      revokeAllUrls();
      renderFeed(posts);
      renderGrid(posts);
    });
  }

  var editingTextId = null;

  function renderFeed(posts){
    feedList.innerHTML = "";
    feedEmpty.hidden = posts.length !== 0;
    posts.forEach(function(post){
      var el = (post.type === "text") ? buildTextPostEl(post) : buildMediaPostEl(post);
      feedList.appendChild(el);
    });
  }

  function buildMediaPostEl(post){
    var media = getMediaArray(post);

    var el = document.createElement("article");
    el.className = "post";

    var frame = buildMediaFrame(media, false);
    frame.insertAdjacentHTML("beforeend",
      '<button class="frame-expand" aria-label="Détails">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3H3v6M15 21h6v-6M21 3l-7 7M3 21l7-7"/></svg>' +
      '</button>'
    );
    el.appendChild(frame);

    if(post.caption){
      var p = document.createElement("p");
      p.className = "post-caption";
      p.textContent = post.caption;
      el.appendChild(p);
    }

    var meta = document.createElement("div");
    meta.className = "post-meta";
    meta.innerHTML =
      '<span class="post-date">' + fmtDate(post.ts) + '</span>' +
      '<button class="pin-btn' + (post.fav ? ' active' : '') + '">' +
        '<svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6H19l-4.6 3.4 1.8 5.6L12 13.2 7.8 16.6l1.8-5.6L5 8h5.2z" stroke="currentColor" stroke-width="1.4"/></svg>' +
      '</button>';
    el.appendChild(meta);

    frame.querySelector(".frame-expand").addEventListener("click", function(){ openDetail(post.id); });
    meta.querySelector(".pin-btn").addEventListener("click", function(){ toggleFav(post); });
    return el;
  }

  function buildTextPostEl(post){
    var el = document.createElement("article");
    el.className = "post post-text";

    if(editingTextId === post.id){
      el.innerHTML =
        '<textarea maxlength="280"></textarea>' +
        '<div class="edit-actions">' +
          '<button class="btn ghost small" data-action="cancel">Annuler</button>' +
          '<button class="btn primary small" data-action="save">Enregistrer</button>' +
        '</div>';
      var ta = el.querySelector("textarea");
      ta.value = post.caption || "";
      el.querySelector('[data-action="cancel"]').addEventListener("click", function(){
        editingTextId = null;
        renderAll();
      });
      el.querySelector('[data-action="save"]').addEventListener("click", function(){
        post.caption = ta.value.trim();
        updatePost(post).then(function(){
          editingTextId = null;
          renderAll();
        });
      });
      return el;
    }

    el.innerHTML =
      '<p class="text-post-body"></p>' +
      '<div class="post-meta">' +
        '<span class="post-date">' + fmtDate(post.ts) + '</span>' +
        '<div class="text-post-actions">' +
          '<button class="pin-btn' + (post.fav ? ' active' : '') + '">' +
            '<svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6H19l-4.6 3.4 1.8 5.6L12 13.2 7.8 16.6l1.8-5.6L5 8h5.2z" stroke="currentColor" stroke-width="1.4"/></svg>' +
          '</button>' +
          '<button class="link-btn" data-action="edit">Modifier</button>' +
          '<button class="link-btn" data-action="delete">Supprimer</button>' +
        '</div>' +
      '</div>';

    el.querySelector(".text-post-body").textContent = post.caption || "";
    el.querySelector(".pin-btn").addEventListener("click", function(){ toggleFav(post); });
    el.querySelector('[data-action="edit"]').addEventListener("click", function(){
      editingTextId = post.id;
      renderAll();
    });
    el.querySelector('[data-action="delete"]').addEventListener("click", function(){
      if(!window.confirm("Supprimer ce post définitivement ?")) return;
      deletePost(post.id).then(renderAll);
    });
    return el;
  }

  function renderGrid(posts){
    gridList.innerHTML = "";
    postCount.textContent = posts.length + (posts.length === 1 ? " publication" : " publications");
    posts.filter(function(p){ return p.type !== "text"; }).forEach(function(post){
      var media = getMediaArray(post);
      if(!media.length) return;
      var first = media[0];
      var cell = document.createElement("div");
      cell.className = "grid-cell";
      if(first.kind === "video"){
        var vUrl = URL.createObjectURL(first.blob);
        objectUrls.push(vUrl);
        cell.innerHTML = '<video src="' + vUrl + '" muted playsinline preload="metadata"></video>' +
          '<div class="grid-video-placeholder"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>';
      } else {
        var url = URL.createObjectURL(first.blob);
        objectUrls.push(url);
        cell.innerHTML = '<img src="' + url + '" alt="">';
      }
      if(media.length > 1){
        cell.insertAdjacentHTML("beforeend",
          '<span class="stack-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="12" height="12" rx="1"/><path d="M7 15v2a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/></svg></span>'
        );
      }
      cell.addEventListener("click", function(){ openDetail(post.id); });
      gridList.appendChild(cell);
    });
  }

  function toggleFav(post){
    post.fav = !post.fav;
    updatePost(post).then(renderAll);
  }

  // ---------- Navigation par onglets ----------

  var tabs = document.querySelectorAll(".tab[data-view]");
  var views = { feed: document.getElementById("view-feed"), grid: document.getElementById("view-grid") };

  function showView(name){
    Object.keys(views).forEach(function(k){ views[k].classList.toggle("active", k === name); });
    tabs.forEach(function(t){ t.classList.toggle("active", t.dataset.view === name); });
  }
  tabs.forEach(function(t){ t.addEventListener("click", function(){ showView(t.dataset.view); }); });

  // ---------- Nouveau post ----------

  var modalNew = document.getElementById("modal-new");
  var fileInput = document.getElementById("file-input");
  var mediaStrip = document.getElementById("media-strip");
  var captionInput = document.getElementById("caption-input");
  var btnPublish = document.getElementById("btn-publish");
  var modeButtons = document.querySelectorAll(".mode-btn");
  var pendingMedia = []; // { blob, kind, previewUrl }
  var newPostMode = "media";

  function setMode(mode){
    newPostMode = mode;
    modeButtons.forEach(function(b){ b.classList.toggle("active", b.dataset.mode === mode); });
    mediaStrip.hidden = (mode === "text");
    captionInput.placeholder = (mode === "text") ? "Quoi de neuf ?" : "Ajoute une légende...";
    updatePublishState();
  }

  function updatePublishState(){
    btnPublish.disabled = (newPostMode === "media") ? (pendingMedia.length === 0) : !captionInput.value.trim();
  }

  modeButtons.forEach(function(b){ b.addEventListener("click", function(){ setMode(b.dataset.mode); }); });
  captionInput.addEventListener("input", updatePublishState);

  var VIDEO_EXTENSIONS = ["mp4", "mov", "m4v", "avi", "3gp", "webm"];

  function renderMediaStrip(){
    Array.prototype.slice.call(mediaStrip.querySelectorAll(".media-tile")).forEach(function(t){ t.remove(); });
    pendingMedia.forEach(function(item, idx){
      var tile = document.createElement("div");
      tile.className = "media-tile";
      if(item.kind === "video"){
        var video = document.createElement("video");
        video.src = item.previewUrl; video.muted = true; video.playsInline = true; video.preload = "metadata";
        tile.appendChild(video);
        var sizeMb = (item.blob.size / 1048576).toFixed(1);
        tile.insertAdjacentHTML("beforeend",
          '<div class="video-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>' +
          '<span class="video-size">' + sizeMb + ' Mo</span>'
        );
      } else {
        tile.innerHTML = '<img src="' + item.previewUrl + '" alt="">';
      }
      tile.insertAdjacentHTML("beforeend", '<button class="media-remove" data-idx="' + idx + '">×</button>');
      mediaStrip.appendChild(tile);
    });
    Array.prototype.slice.call(mediaStrip.querySelectorAll(".media-remove")).forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.dataset.idx, 10);
        if(pendingMedia[idx].previewUrl) URL.revokeObjectURL(pendingMedia[idx].previewUrl);
        pendingMedia.splice(idx, 1);
        renderMediaStrip();
        updatePublishState();
      });
    });
  }

  function clearPendingMedia(){
    pendingMedia.forEach(function(m){ if(m.previewUrl) URL.revokeObjectURL(m.previewUrl); });
    pendingMedia = [];
  }

  function openNewSheet(){
    clearPendingMedia();
    renderMediaStrip();
    captionInput.value = "";
    setMode("media");
    modalNew.hidden = false;
  }
  function closeNewSheet(){
    modalNew.hidden = true;
    clearPendingMedia();
    renderMediaStrip();
  }

  document.getElementById("btn-add").addEventListener("click", openNewSheet);
  document.getElementById("btn-empty-add").addEventListener("click", openNewSheet);
  document.getElementById("btn-cancel").addEventListener("click", closeNewSheet);

  fileInput.addEventListener("change", function(){
    var files = Array.prototype.slice.call(fileInput.files || []);
    if(!files.length) return;
    Promise.all(files.map(function(file){
      var ext = (file.name.split(".").pop() || "").toLowerCase();
      var isVideo = file.type.indexOf("video") === 0 || VIDEO_EXTENSIONS.indexOf(ext) !== -1;
      if(isVideo){
        // On repasse par un Blob "propre" (plutôt que le File natif) : certaines
        // versions de Safari gèrent mal le stockage direct de gros fichiers vidéo en IndexedDB.
        var videoBlob = new Blob([file], { type: file.type || "video/mp4" });
        return Promise.resolve({ blob: videoBlob, kind: "video", previewUrl: URL.createObjectURL(videoBlob) });
      }
      return compressImage(file).then(function(blob){
        return { blob:blob, kind:"image", previewUrl:URL.createObjectURL(blob) };
      }).catch(function(){ return null; });
    })).then(function(results){
      var valid = results.filter(Boolean);
      var skipped = results.length - valid.length;
      pendingMedia = pendingMedia.concat(valid);
      renderMediaStrip();
      updatePublishState();
      if(skipped){ alert(skipped + " fichier(s) n'ont pas pu être ajoutés (format non pris en charge)."); }
    });
    fileInput.value = "";
  });

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){
        if(!done){ done = true; reject(new Error("timeout")); }
      }, ms);
      promise.then(function(v){
        if(!done){ done = true; clearTimeout(timer); resolve(v); }
      }, function(e){
        if(!done){ done = true; clearTimeout(timer); reject(e); }
      });
    });
  }

  function storageInfo(){
    if(navigator.storage && navigator.storage.estimate){
      return navigator.storage.estimate().then(function(est){
        var usedMb = Math.round((est.usage || 0) / 1048576);
        var quotaMb = Math.round((est.quota || 0) / 1048576);
        return " [stockage utilisé : " + usedMb + " Mo / " + quotaMb + " Mo disponibles]";
      }).catch(function(){ return ""; });
    }
    return Promise.resolve("");
  }

  btnPublish.addEventListener("click", function(){
    if(newPostMode === "media" && !pendingMedia.length) return;
    if(newPostMode === "text" && !captionInput.value.trim()) return;
    btnPublish.disabled = true;
    var media = pendingMedia.map(function(m){ return { blob:m.blob, kind:m.kind }; });
    withTimeout(addPost(newPostMode, newPostMode === "media" ? media : null, captionInput.value.trim()), 45000)
      .then(function(){
        closeNewSheet();
        renderAll();
      }).catch(function(err){
        storageInfo().then(function(info){
          var msg;
          if(err && err.message === "timeout"){
            msg = "L'enregistrement prend anormalement longtemps, probablement à cause d'un fichier vidéo trop volumineux pour cet iPod. Essaie avec une vidéo plus courte." + info;
          } else {
            var detail = (err && (err.name || err.message)) ? (err.name || err.message) : "raison inconnue";
            msg = "La publication a échoué (" + detail + ")." + info;
          }
          alert(msg);
        });
        updatePublishState();
      });
  });

  // ---------- Détail / lightbox ----------

  var modalDetail = document.getElementById("modal-detail");
  var detailMedia = document.getElementById("detail-media");
  var detailCaption = document.getElementById("detail-caption");
  var detailDate = document.getElementById("detail-date");
  var btnFav = document.getElementById("btn-fav");
  var favLabel = document.getElementById("fav-label");
  var currentDetail = null;

  function openDetail(id){
    getOne(id).then(function(post){
      currentDetail = post;
      exitEditMode();
      detailMedia.innerHTML = "";
      var media = getMediaArray(post);
      if(media.length){ detailMedia.appendChild(buildMediaFrame(media, true)); }
      detailCaption.textContent = post.caption || "";
      detailCaption.style.display = post.caption ? "" : "none";
      detailDate.textContent = fmtDate(post.ts);
      btnFav.classList.toggle("active", !!post.fav);
      favLabel.textContent = post.fav ? "Épinglé" : "Favori";
      modalDetail.hidden = false;
    });
  }
  document.getElementById("btn-close-detail").addEventListener("click", function(){ modalDetail.hidden = true; exitEditMode(); });

  btnFav.addEventListener("click", function(){
    if(!currentDetail) return;
    currentDetail.fav = !currentDetail.fav;
    updatePost(currentDetail).then(function(){
      btnFav.classList.toggle("active", currentDetail.fav);
      favLabel.textContent = currentDetail.fav ? "Épinglé" : "Favori";
      renderAll();
    });
  });

  document.getElementById("btn-delete").addEventListener("click", function(){
    if(!currentDetail) return;
    if(!window.confirm("Supprimer ce post définitivement ?")) return;
    deletePost(currentDetail.id).then(function(){
      modalDetail.hidden = true;
      renderAll();
    });
  });

  // ---------- Modifier la légende ----------

  var captionInputDetail = document.getElementById("detail-caption-input");
  var editActions = document.getElementById("edit-actions");
  var detailRowMain = document.getElementById("detail-row-main");

  function enterEditMode(){
    if(!currentDetail) return;
    captionInputDetail.value = currentDetail.caption || "";
    detailCaption.hidden = true;
    detailRowMain.hidden = true;
    captionInputDetail.hidden = false;
    editActions.hidden = false;
    captionInputDetail.focus();
  }
  function exitEditMode(){
    captionInputDetail.hidden = true;
    editActions.hidden = true;
    detailCaption.hidden = false;
    detailRowMain.hidden = false;
  }

  document.getElementById("btn-edit-caption").addEventListener("click", enterEditMode);
  document.getElementById("btn-edit-cancel").addEventListener("click", exitEditMode);
  document.getElementById("btn-edit-save").addEventListener("click", function(){
    if(!currentDetail) return;
    currentDetail.caption = captionInputDetail.value.trim();
    updatePost(currentDetail).then(function(){
      detailCaption.textContent = currentDetail.caption;
      detailCaption.style.display = currentDetail.caption ? "" : "none";
      exitEditMode();
      renderAll();
    });
  });

  // ---------- Sauvegarde / restauration ----------

  function blobToBase64(blob){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onloadend = function(){ resolve(reader.result); };
      reader.readAsDataURL(blob);
    });
  }

  document.getElementById("btn-export").addEventListener("click", function(){
    getAll().then(function(posts){
      Promise.all(posts.map(function(p){
        if(p.type === "text"){
          return Promise.resolve({type:"text", caption:p.caption, ts:p.ts, fav:p.fav, media:[]});
        }
        var media = getMediaArray(p);
        return Promise.all(media.map(function(m){
          return blobToBase64(m.blob).then(function(b64){ return { kind:m.kind, data:b64 }; });
        })).then(function(mediaData){
          return { type:"media", caption:p.caption, ts:p.ts, fav:p.fav, media:mediaData };
        });
      })).then(function(data){
        var json = JSON.stringify({version:3, posts:data});
        var blob = new Blob([json], {type:"application/json"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        var d = new Date();
        a.href = url;
        a.download = "blueprint-sauvegarde-" + d.toISOString().slice(0,10) + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    });
  });

  var importInput = document.getElementById("import-input");
  document.getElementById("btn-import-trigger").addEventListener("click", function(){ importInput.click(); });

  importInput.addEventListener("change", function(){
    var file = importInput.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var items = data.posts || [];
        if(!confirm(items.length + " post(s) trouvé(s) dans la sauvegarde. Les ajouter à ta pellicule actuelle ?")) return;
        Promise.all(items.map(function(p){
          var type = p.type || "photo";
          if(type === "text"){
            return new Promise(function(resolve, reject){
              var req = tx("readwrite").add({type:"text", caption:p.caption, ts:p.ts, fav:!!p.fav});
              req.onsuccess = resolve; req.onerror = reject;
            });
          }
          // Compat anciennes sauvegardes (v1/v2 : un seul champ "image" en base64)
          var mediaSrc = (p.media && p.media.length) ? p.media : (p.image ? [{kind:"image", data:p.image}] : []);
          return Promise.all(mediaSrc.map(function(m){
            return fetch(m.data).then(function(r){ return r.blob(); }).then(function(blob){
              return { blob:blob, kind: m.kind || "image" };
            });
          })).then(function(media){
            return new Promise(function(resolve, reject){
              var req = tx("readwrite").add({type:"media", media:media, caption:p.caption, ts:p.ts, fav:!!p.fav});
              req.onsuccess = resolve; req.onerror = reject;
            });
          });
        })).then(function(){
          renderAll();
          alert("Import terminé.");
        });
      }catch(err){
        alert("Ce fichier de sauvegarde n'a pas pu être lu.");
      }
      importInput.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- Bio du profil ----------

  var bioText = document.getElementById("bio-text");
  var bioInput = document.getElementById("bio-input");
  var bioEditActions = document.getElementById("bio-edit-actions");
  var btnEditBio = document.getElementById("btn-edit-bio");

  function loadBio(){
    getProfile().then(function(profile){
      bioText.textContent = profile.bio || "";
    });
  }

  btnEditBio.addEventListener("click", function(){
    bioInput.value = bioText.textContent;
    bioText.hidden = true;
    bioInput.hidden = false;
    btnEditBio.hidden = true;
    bioEditActions.hidden = false;
    bioInput.focus();
  });

  function exitBioEdit(){
    bioInput.hidden = true;
    bioEditActions.hidden = true;
    bioText.hidden = false;
    btnEditBio.hidden = false;
  }

  document.getElementById("btn-bio-cancel").addEventListener("click", exitBioEdit);
  document.getElementById("btn-bio-save").addEventListener("click", function(){
    var bio = bioInput.value.trim();
    saveProfile(bio).then(function(){
      bioText.textContent = bio;
      exitBioEdit();
    });
  });

  // ---------- Démarrage ----------

  openDB().then(function(d){
    db = d;
    renderAll();
    loadBio();
  });

})();
</script>
</body>
</html>
